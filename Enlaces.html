<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Directorio de Enlaces</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        /* =========================================
           VARIABLES Y CONFIGURACIÓN BASE
           ========================================= */
        :root {
            --imms-green: #006341;       /* Verde institucional IMSS */
            --imms-green-hover: #008558; /* Verde brillante para hover */
            --dark-text: #1a2b22;        /* Texto oscuro con tinte verde */
            --bg-color-1: #f0f7f4;       /* Fondo claro 1 */
            --bg-color-2: #e2f0ea;       /* Fondo claro 2 */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        /* =========================================
           FONDO ANIMADO Y ESTRUCTURA
           ========================================= */
        body {
            /* Degradado animado para dar movimiento sutil al fondo */
            background: linear-gradient(-45deg, var(--bg-color-1), var(--bg-color-2), #ffffff, var(--bg-color-1));
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
            color: var(--dark-text);
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px); /* Efecto cristal minimalista */
            -webkit-backdrop-filter: blur(10px);
            padding: 3rem 2rem;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 99, 65, 0.08);
            text-align: center;
            
            /* Animación de entrada del contenedor */
            animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
        }

       
.animated-image {
    width: 70%;
    height: 70%;
    object-fit: cover; /* Mantiene la proporción de la imagen */
          animation: float 3s ease-in-out infinite;
}


        h1 {
            font-weight: 700;
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            color: var(--dark-text);
        }

        p {
            font-weight: 300;
            font-size: 1rem;
            color: #4a5c54;
            margin-bottom: 2.5rem;
            line-height: 1.5;
        }

        /* =========================================
           LISTA DE ENLACES (BOTONES)
           ========================================= */
        .links-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .link-btn {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            color: var(--imms-green);
            text-decoration: none;
            padding: 1.2rem 1.5rem;
            border-radius: 16px;
            font-weight: 500;
            font-size: 1.05rem;
            border: 2px solid transparent;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            
            /* Animación de entrada en cascada */
            opacity: 0;
            transform: translateY(20px);
            animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            animation-delay: calc(var(--order) * 0.15s + 0.3s);
        }

        .link-btn .arrow {
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* EFECTOS HOVER (El "mucho movimiento" al interactuar) */
        .link-btn:hover {
            background: var(--imms-green);
            color: #ffffff;
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 15px 25px rgba(0, 99, 65, 0.25);
            border-color: var(--imms-green);
        }

        .link-btn:hover .arrow {
            transform: translateX(5px);
        }

        /* =========================================
           KEYFRAMES (ANIMACIONES)
           ========================================= */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUpFade {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

    </style>
</head>
<body>

    <div class="container">
        <!-- Encabezado con ícono animado -->
<div class="icon-container image-container">
    <img src="IMSS-Logo.png" alt="Icono" class="animated-image">
</div>
        
        <header>
            <h1>Bienvenido</h1>
            <p>Accede rápidamente a todos los documentos.</p>
        </header>

        <!-- Lista de enlaces. La variable --order define el retraso de la animación -->
        <nav class="links-grid">
            <a href="#tramites" class="link-btn" style="--order: 1;">
                <span>Trámites Digitales</span>
                <span class="arrow">→</span>
            </a>
            <a href="#directorio" class="link-btn" style="--order: 2;">
                <span>Directorio Médico</span>
                <span class="arrow">→</span>
            </a>
            <a href="#documentos" class="link-btn" style="--order: 3;">
                <span>Documentos Oficiales</span>
                <span class="arrow">→</span>
            </a>
            <a href="#citas" class="link-btn" style="--order: 4;">
                <span>Portal de Citas</span>
                <span class="arrow">→</span>
            </a>
            <a href="#ayuda" class="link-btn" style="--order: 5;">
                <span>Soporte y Ayuda</span>
                <span class="arrow">→</span>
            </a>
        </nav>
    </div>

</body>
</html>
